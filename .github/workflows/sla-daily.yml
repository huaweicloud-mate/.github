name: SLA Daily Report

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 工作日 UTC 08:00
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  sla-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests sendgrid

      - name: Generate SLA Daily Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: "huaweicloud-mate"
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_ADMIN_LIST: ${{ secrets.EMAIL_ADMIN_LIST }}
        run: python scripts/sla_monitor.py --report
