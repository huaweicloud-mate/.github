name: GitCode SLA Monitor

on:
  schedule:
    - cron: "0 * * * *"     # 每小时
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run GitCode SLA Monitor
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_ORG: "hd-vector"
        run: python .github/scripts/gitcode_sla.py
