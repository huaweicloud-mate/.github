name: Monthly Report

on:
  schedule:
    - cron: "0 9 1 * *"    # 每月 1 号 UTC 09:00
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Collect and Generate Monthly Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: "huaweicloud-mate"
          REPORT_TYPE: "monthly"
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
        run: python .github/scripts/stats_report.py --type monthly
