name: Issue Statistics

on:
  schedule:
    - cron: "0 9 * * 1"    # 每周一 UTC 09:00
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Collect GitHub Stats
        id: github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: "huaweicloud-mate"
        run: |
          mkdir -p output
          python .github/scripts/github_stats.py > output/github_stats.json

      - name: Collect GitCode Stats
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_ORG: "hd-vector"
        run: python .github/scripts/gitcode_stats.py > output/gitcode_stats.json

      - name: Generate and Send Report
        env:
          GITHUB_DATA: ${{ env.github_output || '' }}
          GITCODE_DATA: ${{ env.gitcode_output || '' }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
        run: python .github/scripts/stats_report.py

      - name: Upload Stats Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-stats
          path: output/
