name: Weekly Report

on:
  schedule:
    - cron: "0 9 * * 1"    # 每周一 UTC 09:00
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests sendgrid

      - name: Collect and Generate Weekly Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: "huaweicloud-mate"
          REPORT_TYPE: "weekly"
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_ADMIN_LIST: ${{ secrets.EMAIL_ADMIN_LIST }}
        run: python scripts/stats_report.py --type weekly
