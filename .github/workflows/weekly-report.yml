name: Weekly Report

on:
  schedule:
    - cron: "0 9 * * 1"    # 每周一 UTC 09:00
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Collect GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: "huaweicloud-mate"
        run: |
          mkdir -p output
          python .github/scripts/github_stats.py > output/github_stats.json

      - name: Collect GitCode Stats
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_ORG: "hd-vector"
        run: python .github/scripts/gitcode_stats.py > output/gitcode_stats.json

      - name: Generate and Send Weekly Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: "huaweicloud-mate"
          REPORT_TYPE: "weekly"
          REPORT_FILE: "output/report.md"
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_REPORT_TO: ${{ secrets.EMAIL_REPORT_TO }}
        run: python .github/scripts/stats_report.py --type weekly

      - name: Archive Report
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          YEAR_WEEK=$(python -c "from datetime import datetime; now=datetime.utcnow(); print(f'{now.year}-w{now.isocalendar()[1]:02d}')")
          YEAR=$(echo $YEAR_WEEK | cut -d'-' -f1)
          WEEK_LABEL=$(echo $YEAR_WEEK | cut -d'-' -f2)
          bash .github/scripts/archive_report.sh "output/report.md" "$YEAR/weekly/$WEEK_LABEL.md" "Weekly report $YEAR-$WEEK_LABEL"
