name: Status Transition

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issues:
    types: [closed, reopened]

permissions:
  issues: write
  contents: read

jobs:
  link-pr-to-issue:
    if: github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prBranch = context.payload.pull_request.head.ref;
            const issueMatches = prBody.match(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi) || [];

            for (const match of issueMatches) {
              const issueNumber = parseInt(match.match(/#(\d+)/)[1]);
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [context.payload.pull_request.user.login]
                });
                const currentIssue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                const labels = currentIssue.data.labels.map(l => l.name);
                const newLabels = labels
                  .filter(l => l !== 'status/pending' && l !== 'status/triaged')
                  .concat('status/in-progress');
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [...new Set(newLabels)]
                });
              } catch (e) {
                console.log(`Failed to update issue #${issueNumber}: ${e.message}`);
              }
            }

  mark-resolved:
    if: github.event.pull_request && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const issueMatches = prBody.match(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi) || [];

            for (const match of issueMatches) {
              const issueNumber = parseInt(match.match(/#(\d+)/)[1]);
              try {
                const currentIssue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                const labels = currentIssue.data.labels.map(l => l.name);
                const newLabels = labels
                  .filter(l => !l.startsWith('status/'))
                  .concat('status/resolved');
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [...new Set(newLabels)]
                });
              } catch (e) {
                console.log(`Failed to mark issue #${issueNumber} as resolved: ${e.message}`);
              }
            }

  mark-completed:
    if: github.event.issue && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const newLabels = labels
              .filter(l => !l.startsWith('status/'))
              .concat('status/completed');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [...new Set(newLabels)]
            });
