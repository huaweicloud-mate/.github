name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-repo
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Issue Bot
        uses: huaweicloud-mate/.github/actions/issue-bot@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_path: ".github-repo/configs/triage-rules.yml"

      - name: Mark as triaged
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const currentLabels = issue.labels.map(l => l.name);
            if (currentLabels.includes('status/triaged') || currentLabels.includes('type/bug') || currentLabels.includes('type/feature')) {
              const newLabels = currentLabels
                .filter(l => l !== 'status/pending')
                .concat('status/triaged');
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...new Set(newLabels)]
              });
            }
