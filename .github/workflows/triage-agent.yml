name: Triage Agent

on:
  workflow_call:
    inputs:
      issue-number:
        description: 'Issue number to triage'
        required: false
        type: string
        default: ''
      confidence-threshold:
        description: 'Min confidence for auto-labeling'
        required: false
        type: string
        default: '0.7'
      dry-run:
        description: 'Dry run mode'
        required: false
        type: string
        default: 'false'
      llm-model:
        description: 'LLM model name'
        required: false
        type: string
        default: 'glm-4-flash'
      llm-endpoint:
        description: 'LLM API endpoint (OpenAI-compatible)'
        required: false
        type: string
        default: 'https://open.bigmodel.cn/api/paas/v4/chat/completions'
    secrets:
      LLM_API_KEY:
        description: 'API key for LLM service'
        required: false

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-repo
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Triage Agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_MODEL: ${{ inputs.llm-model }}
          LLM_ENDPOINT: ${{ inputs.llm-endpoint }}
          CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
          DRY_RUN: ${{ inputs.dry-run }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 .github-repo/actions/triage/triage_agent.py
