name: "Issue Management Bot"
description: "AI-powered issue triage and management for huaweicloud-mate"
inputs:
  app-id:
    description: "GitHub App ID"
    required: false
  app-private-key:
    description: "GitHub App Private Key"
    required: false
  app-installation-id:
    description: "GitHub App Installation ID"
    required: false
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install cryptography

    - name: Run Issue Bot
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        APP_INSTALLATION_ID: ${{ inputs.app-installation-id }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python3 ${{ github.action_path }}/issue_bot.py

    - name: Auto Assign
      shell: bash
      run: |
        python3 -c "
import json, os
event_path = '${{ github.event_path }}'
issue = json.load(open(event_path))['issue']
labels = [l['name'] for l in issue.get('labels', [])]
assignee = 'default-triage'

# area 映射
area_map = {
    'area/api': 'api-maintainer',
    'area/frontend': 'web-maintainer',
    'area/ci-cd': 'devops-maintainer',
    'area/sdk': 'sdk-maintainer',
    'area/security': 'security-maintainer',
    'area/performance': 'performance-maintainer',
}
for area, user in area_map.items():
    if area in labels:
        assignee = user
        break

# bug + critical → tech-lead
if 'type/bug' in labels and 'priority/critical' in labels:
    assignee = 'tech-lead'

print(f'Auto-assign: {assignee}')

import urllib.request
url = f'{os.environ[\"GITHUB_API_URL\"]}/repos/{os.environ[\"GITHUB_REPOSITORY\"]}/issues/${{ github.event.issue.number }}/assignees'
req = urllib.request.Request(url, data=json.dumps({'assignees': [assignee]}).encode(), method='POST')
req.add_header('Authorization', 'Bearer ${{ github.token }}')
req.add_header('Accept', 'application/vnd.github+json')
try:
    urllib.request.urlopen(req)
except Exception as e:
    print(f'Assign failed (maybe user not in org): {e}')
"
