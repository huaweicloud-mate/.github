name: "Issue Management Bot"
description: "AI-powered issue triage and management for huaweicloud-mate"
inputs:
  app-id:
    description: "GitHub App ID"
    required: false
  app-private-key:
    description: "GitHub App Private Key"
    required: false
  app-installation-id:
    description: "GitHub App Installation ID"
    required: false
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install cryptography

    - name: Run Issue Bot
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        APP_INSTALLATION_ID: ${{ inputs.app-installation-id }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python3 ${{ github.action_path }}/issue_bot.py

    - name: Auto Assign
      uses: actions/github-script@v7
      with:
        script: |

          const issue = context.payload.issue;
          const labels = (issue.labels || []).map(l => l.name);
          if (issue.assignees && issue.assignees.length > 0) {
            console.log('Already assigned, skipping');
            return;
          }

          const areaMap = {
            'area/api': 'api-maintainer',
            'area/frontend': 'web-maintainer',
            'area/ci-cd': 'devops-maintainer',
            'area/sdk': 'sdk-maintainer',
            'area/security': 'security-maintainer',
            'area/performance': 'performance-maintainer',
          };

          let assignee = 'default-triage';
          for (const [area, user] of Object.entries(areaMap)) {
            if (labels.includes(area)) {
              assignee = user;
              break;
            }
          }

          if (labels.includes('type/bug') && labels.includes('priority/critical')) {
            assignee = 'tech-lead';
          }

          console.log(`Auto-assign: ${assignee}`);
          await github.rest.issues.addAssignees({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            assignees: [assignee]
          });
