name: Feature Request
description: 💡 提出一个功能建议
title: "[Feature]: "
labels: ["type/enhancement", "agent/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请描述你的使用场景和期望的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题/需求描述
      description: 这个功能要解决什么问题？请描述你的使用场景。
      placeholder: "当我想...的时候，目前无法..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你期望的功能是什么样的？
      placeholder: "希望可以..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案或变通方法？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue，确认没有重复的功能请求
          required: true
        - label: 这个功能对多个用户有普遍价值（不是个人定制需求）
          required: false

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 任何有助于理解需求的信息、截图、参考链接等
    validations:
      required: false
