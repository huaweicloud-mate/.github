name: 'Triage Agent'
description: 'AI-powered Issue triage - classifies issues and applies labels'
inputs:
  issue-number:
    description: 'Issue number to triage'
    required: false
    default: ''
  llm-api-key:
    description: 'API key for LLM service'
    required: false
    default: ''
  llm-model:
    description: 'LLM model name'
    required: false
    default: 'glm-4-flash'
  confidence-threshold:
    description: 'Minimum confidence to auto-apply priority/area labels'
    required: false
    default: '0.7'
  dry-run:
    description: 'If true, only print what would be done'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Triage Agent
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        LLM_MODEL: ${{ inputs.llm-model }}
        CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      shell: bash
      run: python3 ${{ github.action_path }}/triage_agent.py
