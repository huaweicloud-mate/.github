name: Issue Management Bot
description: AI-powered issue triage and management for huaweicloud-mate
inputs:
  app-id:
    description: GitHub App ID
    required: false
  app-private-key:
    description: GitHub App Private Key
    required: false
  app-installation-id:
    description: GitHub App Installation ID
    required: false
  triage-config:
    description: Path to triage-rules.yml (relative to GITHUB_WORKSPACE or absolute)
    required: false
  config-path:
    description: Alias of triage-config (relative to GITHUB_WORKSPACE)
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install cryptography pyyaml
    - shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        APP_INSTALLATION_ID: ${{ inputs.app-installation-id }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        TRIAGE_CONFIG: ${{ inputs.triage-config || inputs.config-path }}
      run: python3 ${{ github.action_path }}/issue_bot.py